<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090b12" />
    <title>Neon Snake</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
          <div>
            <p class="eyebrow">ARCADE // 01</p>
            <h1>NEON SNAKE</h1>
          </div>
        </div>
        <button class="icon-button" id="soundButton" type="button" aria-label="Mute sound" aria-pressed="false">
          <svg class="sound-on" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M11 5 6.8 8.5H3v7h3.8L11 19V5Zm4.2 3.1a5.5 5.5 0 0 1 0 7.8M18 5.5a9 9 0 0 1 0 13" />
          </svg>
        </button>
      </header>

      <section class="game-shell" aria-label="Snake game">
        <aside class="stats" aria-label="Game statistics">
          <div class="stat">
            <span>SCORE</span>
            <strong id="score">000</strong>
          </div>
          <div class="stat">
            <span>BEST</span>
            <strong id="best">000</strong>
          </div>
        </aside>

        <div class="board-wrap">
          <canvas id="game" width="600" height="600" aria-label="Snake game board"></canvas>

          <div class="overlay" id="overlay">
            <div class="overlay-card">
              <p class="eyebrow" id="overlayEyebrow">READY?</p>
              <h2 id="overlayTitle">Start run</h2>
              <p id="overlayText">Eat the cores. Don't hit the walls or yourself.</p>
              <button class="primary-button" id="startButton" type="button">
                <span id="startLabel">PLAY</span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7" /></svg>
              </button>
            </div>
          </div>
        </div>

        <aside class="controls" aria-label="How to play">
          <p>CONTROL</p>
          <div class="key-grid" aria-hidden="true">
            <span></span><kbd>W</kbd><span></span>
            <kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>
          </div>
          <p class="control-note"><kbd>SPACE</kbd> PAUSE</p>
        </aside>
      </section>

      <nav class="touch-controls" aria-label="Touch controls">
        <button type="button" data-direction="up" aria-label="Move up"><svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6" /></svg></button>
        <button type="button" data-direction="left" aria-label="Move left"><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6" /></svg></button>
        <button type="button" data-direction="down" aria-label="Move down"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></svg></button>
        <button type="button" data-direction="right" aria-label="Move right"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6" /></svg></button>
      </nav>
    </main>

    <script src="game.js"></script>
  </body>
</html>
